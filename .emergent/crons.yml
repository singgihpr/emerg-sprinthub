crons:
  - name: weekly-digest
    description: "Sends Monday weekly digest email to admins/owners with last week's hours and overdue tasks"
    cron: "0 8 * * 1"
    timezone: "UTC"
    endpoint: "{{BASE_URL}}/api/cron/weekly-digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: spawn-recurring
    description: "Spawns due recurring task instances (standups/check-ins/routines) once a day"
    cron: "10 0 * * *"
    timezone: "UTC"
    endpoint: "{{BASE_URL}}/api/cron/spawn-recurring"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
